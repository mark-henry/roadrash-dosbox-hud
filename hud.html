<!doctype html>
<meta charset="utf-8">
<title>Road Rash telemetry</title>
<style>
  :root { --bg:#0b0e13; --fg:#e6edf3; --muted:#7d8590; --pos:#3fb950; --neg:#58a6ff;
          --pos2:#f0883e; --warn:#f85149; --panel:#161b22; --line:#30363d; }
  body { background:var(--bg); color:var(--fg); font:13px/1.4 ui-monospace,Menlo,monospace; margin:0; padding:20px; }
  h2 { font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase;
       margin:22px 0 8px; border-bottom:1px solid var(--line); padding-bottom:4px; }
  #bar { display:flex; gap:10px; align-items:center; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:5px;
           padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--muted); }
  #mark.on { background:var(--warn); border-color:var(--warn); color:#fff; font-weight:700; }
  #err { color:var(--warn); margin-left:auto; }
  .g { display:grid; grid-template-columns:200px 1fr 76px; align-items:center; gap:12px; margin:5px 0; }
  .lbl { color:var(--muted); } .lbl b { color:var(--fg); font-weight:600; }
  .val { text-align:right; font-variant-numeric:tabular-nums; }
  .val small { color:var(--muted); }
  .track,.bi { position:relative; height:16px; background:var(--panel); border-radius:3px; }
  .track { overflow:hidden; } .fill { position:absolute; inset:0 auto 0 0; background:var(--pos); }
  .meter .fillred { position:absolute; top:0; bottom:0; background:var(--warn); }
  .meter .thresh { position:absolute; top:0; bottom:0; width:2px; background:#e3b341; z-index:2; }
  .meter .clip { position:absolute; right:2px; top:3px; width:10px; height:10px; border-radius:2px;
                 background:#2a1414; border:1px solid #4a1f1f; z-index:3; }
  .meter .clip.on { background:var(--warn); border-color:var(--warn); box-shadow:0 0 7px var(--warn); }
  .bi::before { content:''; position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--line); }
  .bn { position:absolute; top:0; bottom:0; right:50%; background:var(--neg); }
  .bp { position:absolute; top:0; bottom:0; left:50%; background:var(--pos2); }
  .crash-on { color:var(--warn); font-weight:700; }
  table { border-collapse:collapse; font-size:12px; width:100%; }
  th { text-align:right; color:var(--muted); font-weight:600; cursor:pointer; padding:2px 8px;
       border-bottom:1px solid var(--line); user-select:none; }
  th:first-child { text-align:left; }
  td { text-align:right; font-variant-numeric:tabular-nums; padding:1px 8px; }
  td:first-child { text-align:left; color:var(--muted); }
  tr.active td:first-child { color:var(--pos); }
  body { margin-right:78px; }
  #strip { position:fixed; top:0; right:0; width:66px; height:100vh; background:var(--panel);
           border-left:1px solid var(--line); }
  #strip .finish { position:absolute; top:0; left:0; right:0; height:2px; background:var(--warn); }
  #strip .start  { position:absolute; bottom:0; left:0; right:0; height:2px; background:var(--muted); }
  #strip .t { position:absolute; left:5px; font-size:9px; color:var(--muted); letter-spacing:.06em; }
  #me { position:absolute; left:0; right:0; height:3px; background:var(--pos); transition:bottom .08s linear; }
  #me::after { content:''; position:absolute; right:1px; top:-4px; border:5px solid transparent; border-right-color:var(--pos); }
  #cal { position:absolute; bottom:6px; left:5px; right:5px; display:flex; flex-direction:column; gap:3px; }
  #cal button { font-size:9px; padding:2px 0; }
</style>

<div id="bar">
  <h2 style="border:0;margin:0">Road Rash — live telemetry</h2>
  <button id="mark">MARK: off</button>
  <button id="reset">reset peaks</button>
  <button id="setStart">⤓ set start</button>
  <button id="setFin">⤒ set finish</button>
  <span id="err"></span>
</div>

<div id="strip" title="track progress (0x1C odometer)">
  <div class="finish"></div><div class="t" style="top:4px">FIN</div>
  <div class="start"></div><div class="t" style="bottom:4px">START</div>
  <div id="me" style="bottom:0"></div>
</div>

<div id="interp"></div>

<h2>Discovery — every dword (click a header to sort; hunt the slip field while screeching)</h2>
<table id="disc"><thead><tr>
  <th data-k="off">offset</th><th data-k="cur">current</th>
  <th data-k="min">min</th><th data-k="max">max</th><th data-k="range">range ▾</th>
</tr></thead><tbody></tbody></table>

<script>
/* ============================================================================
   SINGLE SOURCE OF TRUTH — Road Rash (PC v1.0, ROADRASH.EXE @ ImageBase 0x400000)
   rider-struct field map. The gauges below ARE the documentation; commentary
   lives in the comments. reader.py follows the pointer at virtual 0x4642D8 ->
   the active bike struct; every offset here is from that struct base. Found via
   live DOSBox-X memory reads + Caps-Lock-marked runs (story in LOG.md / git log).
   FRONTIERS: (1) rivals on the track strip — find the rider array (0x40 stride,
   player = rider 0) and stream each rival's +0x1C. (2) a track-length field to
   auto-calibrate the finish line.
   Each entry: [offset, label, kind];  kind = uni | bi | num | meter
   ============================================================================ */
const GROUPS = [
  ['Motion', [
    [0xEC,  'speed',                      'uni'],  // forward speed (near-copy at 0x108)
    [0x2E8, 'forward speed (≈0xEC)',       'uni'],  // ~identical to 0xEC (corr 1.0, +24)
    [0x114, 'throttle/brake',             'bi'],   // player accel/brake input level
    [0xF0,  'lateral velocity (L/R)',     'bi'],   // instantaneous sideways speed (copy at 0x104)
    [0x10C, 'net lateral movement',       'bi'],   // bounded ±~2500; not a clean integral of 0xF0
    [0xD4,  'lateral pos?',               'bi'],   // lateral-ish; does NOT saturate at the road edge
    [0xF4,  'vertical vel (hills/jumps)', 'bi'],   // + uphill / − downhill; spikes on jumps
  ]],
  ['Slip / screech', [
    [0x164, 'slip meter',                 'meter'],// tire screech when > ~50 (SLIP_THRESH); slide-specific,
  ]],                                              //   NOT braking; amplified ~5x while oil timer 0x298 is active
  ['Steering', [
    [0x128, 'road bend',                  'bi'],   // track curvature pushing the rider (±50, scales w/ speed)
    [0x130, 'bend push force',            'bi'],   // ≈ bend/351 (r=0.76) — lateral push the bend produces
    [0x60,  'turning state',              'bi'],   // L/R turn input/state (copy at 0x6C)
    [0x5C,  'hard-turn force',            'bi'],   // stepped; engages on hard turns only (copy at 0x68)
    [0x118, 'lateral/lean',               'bi'],
  ]],
  ['Lean', [
    [0x288, 'lean (lead)',                'bi'],   // 0x288 leads 0x28C by ~1 frame
    [0x28C, 'lean (lag)',                 'bi'],
  ]],
  ['Terrain & hazards', [
    [0x158, 'rough terrain (off-road)',   'uni'],  // ~0 on road, 20–30 off-road (triplet 0x24/38/4C fires too)
    [0x298, 'oil timer (slip-vuln)',      'uni'],  // set ~117 on oil contact, ticks down ~1/frame (~1.6s); cuts grip
  ]],
  ['Status', [
    [0x2F0, 'health',                     'uni'],  // mirrored at 0x2EC
    [0x2F4, 'crash state',                'num'],  // 0 = upright
    [0x328, 'rider index',                'num'],  // 0 = player (calibration anchor)
  ]],
  ['Track distance (frontier #1)', [
    [0x1C,  'track distance (fwd)',       'num'],  // cumulative odometer, monotonic (copies 0x30/0x44/0x134/0x138)
    [0x308, 'segment progress',           'num'],  // sawtooth — resets each track segment, not overall progress
    [0x30,  'distance (copy)',            'num'],
    [0x310, 'distance D',                 'num'],
  ]],
  ['Misc — active unknowns (watching for surprises)', [
    [0xC,'map load? (halting ramp)','uni'], [0x10,'map load? (halting ramp)','bi'],   // 0xC & 0x10 ramp up haltingly — segment/map streaming?
    [0x14,'+0x14','uni'], [0x18,'+0x18','uni'], [0x84,'+0x84','bi'], [0x88,'+0x88','uni'], [0xA0,'+0xA0','bi'], [0xA4,'+0xA4','uni'], [0xB0,'+0xB0','uni'], [0xB4,'+0xB4','uni'], [0xB8,'+0xB8','uni'], [0xC0,'+0xC0','uni'], [0xC8,'+0xC8','uni'], [0xCC,'+0xCC','uni'], [0xD8,'+0xD8','uni'], [0xFC,'+0xFC','bi'], [0x11C,'+0x11C','bi'], [0x12C,'+0x12C','bi'], [0x154,'+0x154','uni'], [0x15C,'+0x15C','uni'], [0x160,'+0x160','uni'], [0x17C,'+0x17C','uni'], [0x23C,'+0x23C','uni'], [0x244,'+0x244','uni'], [0x278,'+0x278','uni'], [0x2F8,'+0x2F8','uni'], [0x30C,'+0x30C','uni'],
  ]],
];

const $ = (id) => document.getElementById(id);
const hex = (o) => '+0x' + o.toString(16).toUpperCase();
const SLIP_THRESH = 50, SLIP_MAX = 120;   // slip-meter screech threshold & full-scale
let N = 0, peak = [], lo = [], hi = [], started = false, sortKey = 'range', sortDir = -1;

// build interpreted rows
const interp = $('interp');
for (const [title, rows] of GROUPS) {
  const h = document.createElement('h2'); h.textContent = title; interp.appendChild(h);
  for (const [off, label, kind] of rows) {
    const d = document.createElement('div'); d.className = 'g';
    const mid = kind === 'uni' ? `<div class="track"><div class="fill" id="f${off}"></div></div>`
              : kind === 'bi'  ? `<div class="bi"><div class="bn" id="n${off}"></div><div class="bp" id="p${off}"></div></div>`
              : kind === 'meter' ? `<div class="track meter"><div class="fill" id="f${off}"></div><div class="fillred" id="fr${off}"></div><div class="thresh" style="left:${SLIP_THRESH / SLIP_MAX * 100}%"></div><div class="clip" id="cl${off}"></div></div>`
              : `<div></div>`;
    d.innerHTML = `<span class="lbl"><b>${label}</b></span>${mid}<span class="val" id="v${off}"></span>`;
    interp.appendChild(d);
  }
}
const KNOWN = Object.fromEntries(GROUPS.flatMap(([, r]) => r).map(([o, l, k]) => [o, [l, k]]));

function initArrays(n) {
  N = n; peak = Array(n).fill(0); lo = Array(n).fill(Infinity); hi = Array(n).fill(-Infinity);
  const tb = $('disc').querySelector('tbody');
  tb.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const tr = document.createElement('tr'); tr.id = 'r' + i;
    tr.innerHTML = `<td>${hex(i * 4)}</td><td id="c${i}"></td><td id="lo${i}"></td><td id="hi${i}"></td><td id="rg${i}"></td>`;
    tb.appendChild(tr);
  }
}
function resetPeaks() { peak.fill(0); lo.fill(Infinity); hi.fill(-Infinity); }
$('reset').onclick = resetPeaks;

let markOn = false;
$('mark').onclick = () => { markOn = !markOn; fetch('/mark?v=' + (markOn ? 1 : 0));
  $('mark').textContent = 'MARK: ' + (markOn ? 'ON' : 'off'); $('mark').className = markOn ? 'on' : ''; };

$('disc').querySelectorAll('th').forEach(th => th.onclick = () => {
  const k = th.dataset.k; sortDir = (sortKey === k) ? -sortDir : -1; sortKey = k; resort();
});
function resort() {
  const tb = $('disc').querySelector('tbody');
  const key = (i) => sortKey === 'off' ? i : sortKey === 'cur' ? Math.abs(cur[i] || 0)
            : sortKey === 'min' ? lo[i] : sortKey === 'max' ? hi[i] : (hi[i] - lo[i]);
  const order = [...Array(N).keys()].sort((a, b) => (key(a) - key(b)) * sortDir);
  for (const i of order) tb.appendChild($('r' + i));
}

let cur = [], frame = 0;

// vertical track-progress strip — uses +0x1C odometer; calibrate start/finish (persisted)
const DIST = 0x1C / 4;
let startD = localStorage.ttStart ? +localStorage.ttStart : null;
let finD   = localStorage.ttFin   ? +localStorage.ttFin   : null;
$('setStart').onclick = () => { startD = cur[DIST]; localStorage.ttStart = startD; };
$('setFin').onclick   = () => { finD   = cur[DIST]; localStorage.ttFin   = finD; };
function updateStrip(dist) {
  if (startD == null || finD == null || finD === startD) { $('me').style.bottom = '0'; return; }
  const p = Math.max(0, Math.min(1, (dist - startD) / (finD - startD)));
  $('me').style.bottom = (p * 100) + '%';
}

const es = new EventSource('/stream');
es.onmessage = (e) => {
  const d = JSON.parse(e.data);
  if (d.error) { $('err').textContent = '⚠ ' + d.error; return; }
  $('err').textContent = '';
  cur = d.v;
  if (cur.length !== N) initArrays(cur.length);   // size peak arrays from the data itself
  updateStrip(cur[DIST]);
  // keep mark button in sync with server
  if (!!d.mark !== markOn) { markOn = !!d.mark; $('mark').textContent = 'MARK: ' + (markOn ? 'ON' : 'off'); $('mark').className = markOn ? 'on' : ''; }

  for (let i = 0; i < N; i++) {
    const x = cur[i];
    if (x < lo[i]) lo[i] = x; if (x > hi[i]) hi[i] = x;
    peak[i] = Math.max(peak[i], Math.abs(x));
  }
  // interpreted gauges (auto-scaled to running peak)
  for (const off in KNOWN) {
    const o = +off, i = o / 4, [, kind] = KNOWN[off], x = cur[i], pk = peak[i] || 1;
    $('v' + o).textContent = x;
    if (kind === 'uni') $('f' + o).style.width = Math.min(100, Math.abs(x) / pk * 100) + '%';
    else if (kind === 'meter') {
      const v = Math.max(0, x);
      $('f' + o).style.width = Math.min(SLIP_THRESH, v) / SLIP_MAX * 100 + '%';
      $('fr' + o).style.left = SLIP_THRESH / SLIP_MAX * 100 + '%';
      $('fr' + o).style.width = Math.max(0, Math.min(v, SLIP_MAX) - SLIP_THRESH) / SLIP_MAX * 100 + '%';
      $('cl' + o).className = 'clip' + (v >= SLIP_THRESH ? ' on' : '');   // real-time: on only while slipping
    }
    else if (kind === 'bi') {
      const h = Math.min(100, Math.abs(x) / pk * 100) / 2;
      $('p' + o).style.width = (x >= 0 ? h : 0) + '%'; $('n' + o).style.width = (x < 0 ? h : 0) + '%';
    }
    if (o === 0x2F4) $('v' + o).className = 'val' + (x ? ' crash-on' : '');
  }
  // discovery table values (text only each frame; rows reorder on header click)
  for (let i = 0; i < N; i++) {
    $('c' + i).textContent = cur[i];
    $('lo' + i).textContent = lo[i] === Infinity ? '' : lo[i];
    $('hi' + i).textContent = hi[i] === -Infinity ? '' : hi[i];
    $('rg' + i).textContent = (hi[i] - lo[i]) || 0;
    $('r' + i).className = (hi[i] - lo[i]) ? 'active' : '';
  }
  if (++frame % 15 === 0 && sortKey !== 'off') resort();   // re-sort ~2x/sec when sorting by activity
};
es.onerror = () => $('err').textContent = '⚠ stream disconnected — is reader.py running?';

// live-reload on hud.html change
let mt0 = null;
setInterval(async () => { try { const m = await (await fetch('/mtime')).text();
  if (mt0 === null) mt0 = m; else if (m !== mt0) location.reload(); } catch {} }, 1000);
</script>
