# DOSBox-X config for Road Rash (Win95) — local introspection rig
# Mirrors dos.zone's working js-dos settings, adapted for native DOSBox-X
# with the game CD attached to the secondary IDE so Win95 sees a CD-ROM.

[log]
logfile=/Users/markhenry/roadrash/dosbox-x.log

[sdl]
autolock=false
mouse_emulation=integration

[dosbox]
title=Road Rash Win95
memsize=128

[video]
vmemsize=8
vesa modelist width limit=0
vesa modelist height limit=0

[dos]
ver=7.1
hard drive data rate limit=0
floppy drive data rate limit=0

[cpu]
cputype=pentium_mmx
core=auto
integration device=true

[sblaster]
sbtype=sb16vibra

[fdc, primary]
int13fakev86io=true

[ide, primary]
int13fakeio=true
int13fakev86io=true

[ide, secondary]
int13fakeio=true
int13fakev86io=true
cd-rom insertion delay=4000

[render]
scaler=none

[autoexec]
# Hard disk (Win95 C:) -> primary master IDE, then CD -> secondary master IDE.
# A guest-OS CD must be mounted to a DRIVE LETTER with -ide (not a numbered slot),
# so Win95 sees an ATAPI CD-ROM with media present at boot.
imgmount 2 "/Users/markhenry/roadrash/win95-c.img" -ide 1m
imgmount d "/Users/markhenry/roadrash/ROADRASH.ISO" -t iso -ide 2m
boot c:
